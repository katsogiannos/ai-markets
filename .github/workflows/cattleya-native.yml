name: Cattleya Native Windows Installer
on:
  push:
    branches: [cattleya-notifications-setup]
    paths:
      - 'cattleya-native/**'
      - '.github/workflows/cattleya-native.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Resolve native UI and Windows credential dependencies
        shell: pwsh
        run: |
          cd cattleya-native
          go mod init cattleya-notifications
          go get github.com/lxn/walk@latest github.com/danieljoos/wincred@latest golang.org/x/sys/windows/registry@latest
          go mod tidy
      - name: Compile native Windows GUI executable
        shell: pwsh
        run: |
          cd cattleya-native
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../CattleyaNotificationsSetup.exe .
          if (!(Test-Path ../CattleyaNotificationsSetup.exe)) { throw "Windows executable missing" }
          Get-FileHash ../CattleyaNotificationsSetup.exe -Algorithm SHA256
      - name: Publish native setup release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete cattleya-notifications-native-v3.0.0 --yes --cleanup-tag 2>$null
          $hash=(Get-FileHash CattleyaNotificationsSetup.exe -Algorithm SHA256).Hash
          gh release create cattleya-notifications-native-v3.0.0 CattleyaNotificationsSetup.exe --target "$env:GITHUB_SHA" --title "Cattleya Notifications native Windows v3.0" --notes "Native Windows GUI, no PowerShell. SHA256: $hash. Currently unsigned." --latest=false
